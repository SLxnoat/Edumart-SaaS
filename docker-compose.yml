services:
  db:
    image: mysql:8.0
    container_name: edumart-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: edumart
      MYSQL_USER: edumart_user
      MYSQL_PASSWORD: edumart_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edumart_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edumart-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: edumart
      DB_USER: edumart_user
      DB_PASSWORD: edumart_password
      JWT_SECRET: supersecretjwtkey
    ports:
      - "5000:5000"
    networks:
      - edumart_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edumart-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - edumart_network

volumes:
  db_data:

networks:
  edumart_network:
    driver: bridge
